<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <br>
    <div class="container">
        <h1>Bem-vindo!</h1>
        <h5>Entre e pratique suas habilidades de sintaxe</h5>
        <br>
        <label for="form-control">Usuário:</label>

        <input type="text" class="form-control" placeholder="Digite seu usuário" aria-label="Example text with button addon" aria-describedby="button-addon1">

        <div class="input-group">
            <input type="password" class="form-control" placeholder="Digite sua senha" aria-label="Example text with button addon" aria-describedby="button-addon1">
        </div>

        <button class="acessar">Acessar</button>
    </div>
</body>
